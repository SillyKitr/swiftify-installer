
name: Build Swiftify Installer

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Build application
        run: cargo build --release --no-default-features --features qt --bin swiftify-installer-qt --target x86_64-pc-windows-msvc

      - name: Package application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = "target/x86_64-pc-windows-msvc/release"
          $distDir = "dist"
          $packageDir = "$distDir/swiftify-installer"

          $executables = @(Get-ChildItem $buildDir -Filter "*.exe" -File)

          if ($executables.Count -ne 1) {
            throw "Expected exactly one executable in $buildDir, found $($executables.Count)"
          }

          $executable = $executables[0].FullName

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item $executable $packageDir

          $packagedExe = Join-Path $packageDir $executables[0].Name

          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe"

          if (!(Test-Path $windeployqt)) {
            throw "windeployqt was not found at $windeployqt"
          }

          & $windeployqt `
            --release `
            --compiler-runtime `
            --qmldir qml `
            --dir $packageDir `
            $packagedExe

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          Compress-Archive `
            -Path "$packageDir/*" `
            -DestinationPath "$distDir/swiftify-installer-windows-x64.zip" `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftify-installer-windows-x64
          path: dist/swiftify-installer-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Swiftify Installer ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/swiftify-installer-windows-x64.zip
          fail_on_unmatched_files: true
